<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vibe Tank: quizbowl practice in a Frutiger Aero aquarium. Word-by-word tossups, five high school levels, and an Anki-style study deck.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.3' cy='.25' r='.9'%3E%3Cstop offset='0' stop-color='%23fff'/%3E%3Cstop offset='.35' stop-color='%239FE9FF'/%3E%3Cstop offset='1' stop-color='%230B6A9B'/%3E%3C/radialGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3C/svg%3E">
<title>Vibe Tank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Mukta:wght@400;500;700&family=Orbitron:wght@600;800&family=Exo+2:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --sky-top: #6ECBFF; --sky-mid: #BFEBFF; --sky-low: #F0FBFF;
    --hill-1: #9BE36A; --hill-2: #4DB33A; --hill-shine: rgba(255,255,255,.55);
    --sun: rgba(255,255,235,.95);
    --ink: #0B2540; --ink-soft: #3F5B76;
    --card: #FFFFFF; --card-2: rgba(255,255,255,.7);
    --glass-top: rgba(255,255,255,.86); --glass-bot: rgba(255,255,255,.56); --glass-edge: rgba(255,255,255,.95);
    --bar-top: rgba(255,255,255,.95); --bar-bot: rgba(200,235,255,.75);
    --line: rgba(27,141,183,.25);
    --accent: #1B8DB7; --accent-deep: #0F6A92;
    --good: #2F9A1F; --bad: #D6335C; --gold: #FFC93C; --pink: #FF5F86;
    --host: #2BB0E0;
    --shadow: 0 24px 60px -26px rgba(8,62,104,.5);
    --display: "M PLUS Rounded 1c", "Segoe UI", "Frutiger", system-ui, sans-serif;
    --body: "Segoe UI", "Frutiger", "Mukta", "Myriad Pro", system-ui, -apple-system, sans-serif;
  }
  body[data-scene="aquarium"] {
    --sky-top: #075E93; --sky-mid: #2AA3D2; --sky-low: #8FE0F0;
    --hill-1: #F3DDA2; --hill-2: #D8B866; --hill-shine: rgba(255,255,255,.35); --sun: rgba(220,250,255,.7);
  }
  body[data-scene="sunset"] {
    --sky-top: #FF8A5B; --sky-mid: #FFC39A; --sky-low: #FFEBD9;
    --hill-1: #5ED0E6; --hill-2: #1C93BD; --hill-shine: rgba(255,255,255,.5); --sun: rgba(255,245,200,.95);
  }
  body[data-scene="aurora"] {
    color-scheme: dark;
    --sky-top: #03101F; --sky-mid: #0A2E45; --sky-low: #0E4E57;
    --hill-1: #0F4B3C; --hill-2: #07301F; --hill-shine: rgba(120,255,210,.25); --sun: rgba(110,255,200,.35);
    --ink: #E8FBFF; --ink-soft: #A8CCDA;
    --card: #10283A; --card-2: rgba(16,40,58,.72);
    --glass-top: rgba(22,48,70,.82); --glass-bot: rgba(10,28,44,.66); --glass-edge: rgba(140,220,255,.28);
    --bar-top: rgba(60,120,160,.65); --bar-bot: rgba(20,50,75,.6);
    --line: rgba(140,220,255,.25);
    --accent: #45C3F0; --accent-deep: #8FDDF7;
    --good: #5FD34A; --bad: #FF6B8B;
    --shadow: 0 24px 60px -26px rgba(0,0,0,.8);
  }
  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    margin: 0; font-family: var(--body); font-size: 16px; line-height: 1.5; color: var(--ink);
    background:
      radial-gradient(60% 40% at 85% 6%, var(--sun) 0%, transparent 60%),
      linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 45%, var(--sky-low) 80%);
    background-color: var(--sky-mid);
    background-attachment: fixed;
  }
  .scene { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  #bubbles { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 150px; display: grid; gap: 18px; }
  #app { display: grid; gap: 18px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 44px; height: 44px; border-radius: 14px; background: radial-gradient(circle at 30% 25%, #fff 0 12%, #9FE9FF 30%, #1EA0D8 75%, #0B6A9B); box-shadow: 0 8px 18px -6px rgba(14,107,150,.7), inset 0 -3px 8px rgba(0,50,80,.35); position: relative; }
  .brand-mark::after { content: ""; position: absolute; left: 6px; right: 6px; top: 3px; height: 45%; border-radius: 10px 10px 50% 50%; background: linear-gradient(rgba(255,255,255,.85), rgba(255,255,255,0)); }
  .brand-name { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 6vw, 38px); line-height: 1; color: #fff; text-shadow: 0 1px 0 rgba(0,60,100,.4), 0 2px 12px rgba(0,90,140,.45); letter-spacing: -.01em; }
  .brand-sub { font-size: 12.5px; font-weight: 600; color: #fff; text-shadow: 0 1px 3px rgba(0,60,100,.55); letter-spacing: .02em; }
  .top-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill-btn { font: 700 13px/1 var(--body); color: var(--accent-deep); cursor: pointer; border-radius: 99px; padding: 9px 14px; border: 1px solid var(--glass-edge);
    background: linear-gradient(180deg, var(--bar-top), var(--bar-bot)); box-shadow: 0 6px 14px -8px rgba(0,60,100,.6), inset 0 1px 0 rgba(255,255,255,.8); }
  .pill-btn:hover { filter: brightness(1.05); }
  .pill-btn.warn { color: #8A1432; background: #FFE7EC; }
  .board { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat-chip { display: grid; gap: 0; padding: 6px 12px; border-radius: 12px; background: linear-gradient(180deg, var(--bar-top), var(--bar-bot)); border: 1px solid var(--glass-edge); min-width: 54px; text-align: center; }
  .stat-chip b { font-family: var(--display); font-size: 18px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat-chip span { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }

  /* ---------- aero windows ---------- */
  .win { position: relative; border-radius: 16px; background: linear-gradient(180deg, var(--glass-top), var(--glass-bot)); border: 1px solid var(--glass-edge);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.7); -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4); overflow: hidden; }
  .titlebar { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--bar-top) 0%, var(--bar-top) 48%, var(--bar-bot) 52%, var(--bar-bot) 100%); }
  .titlebar .tb-dot { width: 12px; height: 12px; border-radius: 4px; background: radial-gradient(circle at 35% 30%, #fff 0 15%, var(--c, var(--accent)) 60%); box-shadow: inset 0 -1px 2px rgba(0,0,0,.2); flex: none; }
  .titlebar .tb-title { font-weight: 700; font-size: 13.5px; color: var(--ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tb-ctrls { display: flex; gap: 4px; flex: none; }
  .tb-ctrls i { width: 26px; height: 16px; border-radius: 4px; border: 1px solid rgba(255,255,255,.7); background: linear-gradient(180deg, rgba(255,255,255,.7), rgba(180,220,240,.5)); display: block; }
  .tb-ctrls i:last-child { width: 40px; background: linear-gradient(180deg, #F5A08E 0%, #E0533A 50%, #C63B22 51%, #E86A4E 100%); border-color: rgba(255,255,255,.6); }
  .win-body { padding: clamp(16px, 3.6vw, 26px); display: grid; gap: 16px; position: relative; }
  .win-body::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 90px; background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0)); pointer-events: none; }
  body[data-scene="aurora"] .win-body::before { background: linear-gradient(180deg, rgba(140,220,255,.08), rgba(0,0,0,0)); }
  .win-body > * { position: relative; }
  .h2 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.15; }
  .h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.2; }
  .label { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); display: block; }
  .muted { color: var(--ink-soft); font-size: 14px; margin: 0; }
  .card { background: var(--card); border-radius: 14px; padding: 14px 16px; border: 1px solid var(--line); }

  /* ---------- host orb ---------- */
  .host { display: flex; align-items: center; gap: 12px; }
  .orb { flex: none; width: 56px; height: 56px; border-radius: 50%; position: relative;
    background: radial-gradient(circle at 34% 28%, #fff 0 9%, color-mix(in srgb, var(--host) 35%, white) 24%, var(--host) 62%, color-mix(in srgb, var(--host) 55%, black) 100%);
    box-shadow: 0 8px 18px -6px color-mix(in srgb, var(--host) 70%, black), inset 0 -4px 10px rgba(0,0,0,.25); }
  .orb::before, .orb::after { content: ""; position: absolute; top: 44%; width: 12%; height: 18%; border-radius: 50%; background: #0B2540; animation: blink 5s infinite; }
  .orb::before { left: 33%; } .orb::after { right: 29%; }
  .orb .acc { position: absolute; left: 50%; top: -30%; transform: translateX(-50%); font-size: 0.5em; line-height: 1; }
  .orb.s { width: 36px; height: 36px; font-size: 36px; } .orb.m { font-size: 56px; } .orb.l { width: 96px; height: 96px; font-size: 96px; }
  .orb.thinking { animation: bob 1.4s ease-in-out infinite; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-6deg); } }
  .host-name { font-family: var(--display); font-weight: 800; font-size: 18px; line-height: 1.1; }
  .host-role { font-size: 12px; color: var(--ink-soft); }
  .host-speech { display: flex; gap: 12px; align-items: flex-start; }
  .host-speech p { margin: 0; }
  .speech { background: var(--card); border-radius: 14px; padding: 12px 16px; margin: 0; max-width: 66ch; border: 1px solid var(--line); }

  /* ---------- form bits ---------- */
  .field { display: grid; gap: 6px; max-width: 420px; }
  .text-in { width: 100%; box-sizing: border-box; font: 600 17px/1.2 var(--body); color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px;
    box-shadow: inset 0 2px 5px rgba(0,40,70,.08); }
  .text-in:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent); }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .seg button, .chipbtn { cursor: pointer; font: 700 14px/1 var(--body); color: var(--ink-soft); padding: 10px 14px; border-radius: 99px; border: 1px solid var(--line);
    background: linear-gradient(180deg, var(--bar-top), var(--bar-bot)); }
  .seg button[aria-pressed="true"] { color: #fff; border-color: transparent; background: linear-gradient(180deg, #8FE6F9 0%, #36B3DE 48%, #1A93C2 52%, #2BB0D9 100%); text-shadow: 0 1px 1px rgba(0,60,90,.4); }
  .setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 18px; }
  .setup-grid > div { display: grid; gap: 8px; align-content: start; }
  .cats { display: grid; gap: 12px; }
  .cat-group { display: grid; gap: 6px; }
  .cat-head { display: flex; align-items: center; gap: 8px; }
  .cat-head button { cursor: pointer; background: none; border: 0; padding: 0; font: 800 13px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .subchip { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font: 600 14px/1 var(--body); padding: 8px 12px 8px 9px; border-radius: 99px; background: var(--card-2); border: 2px solid transparent; color: var(--ink-soft); }
  .subchip .sw { width: 12px; height: 12px; border-radius: 50%; background: var(--c); opacity: .3; }
  .subchip[aria-pressed="true"] { background: var(--card); border-color: var(--c); color: var(--ink); }
  .subchip[aria-pressed="true"] .sw { opacity: 1; }
  .toggle { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; font-size: 14.5px; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
  .modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .mode { background: var(--card); border-radius: 14px; padding: 16px; display: grid; gap: 10px; align-content: start; border: 1px solid var(--line); }
  .join { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .join .text-in { text-transform: uppercase; letter-spacing: .2em; font-size: 16px; }
  .how { margin: 0; padding-left: 20px; display: grid; gap: 5px; font-size: 14.5px; color: var(--ink-soft); }
  .how b { color: var(--ink); }
  kbd { font: 700 12px/1 var(--body); padding: 3px 7px; border-radius: 6px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 2px 0 var(--line); color: var(--ink); }

  /* ---------- buttons ---------- */
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn { position: relative; overflow: hidden; cursor: pointer; border: 0; border-radius: 99px; font: 700 16px/1 var(--body); padding: 14px 24px; color: #fff; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(180deg, #9BEBFB 0%, #3CB6E0 48%, #1690C0 52%, #2DB3DC 100%);
    box-shadow: 0 10px 22px -10px rgba(16,110,150,.85), inset 0 -2px 4px rgba(0,60,90,.3), inset 0 0 0 1px rgba(255,255,255,.4);
    text-shadow: 0 1px 1px rgba(0,60,90,.45); transition: transform .12s, filter .12s; }
  .btn::after { content: ""; position: absolute; left: 7%; right: 7%; top: 2px; height: 44%; border-radius: 99px; background: linear-gradient(rgba(255,255,255,.8), rgba(255,255,255,.1)); pointer-events: none; }
  .btn:hover { filter: brightness(1.06) saturate(1.1); transform: translateY(-1px); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { filter: grayscale(.8) opacity(.55); cursor: not-allowed; transform: none; }
  .btn.green { background: linear-gradient(180deg, #C5F59A 0%, #6FCE3F 48%, #43A91E 52%, #66C93A 100%); box-shadow: 0 10px 22px -10px rgba(40,120,20,.85), inset 0 -2px 4px rgba(20,70,0,.3), inset 0 0 0 1px rgba(255,255,255,.4); text-shadow: 0 1px 1px rgba(20,70,0,.45); }
  .btn.pink { background: linear-gradient(180deg, #FFB6C8 0%, #FF6B90 48%, #E9446F 52%, #FF6A8E 100%); box-shadow: 0 10px 22px -10px rgba(220,50,95,.85), inset 0 -2px 4px rgba(120,0,40,.25), inset 0 0 0 1px rgba(255,255,255,.4); text-shadow: 0 1px 1px rgba(120,0,40,.4); }
  .btn.ghost { color: var(--accent-deep); background: linear-gradient(180deg, var(--bar-top), var(--bar-bot)); box-shadow: inset 0 0 0 1px var(--line), 0 6px 14px -10px rgba(0,60,100,.6); text-shadow: none; font-size: 14.5px; padding: 11px 16px; }
  .btn.ghost::after { opacity: .5; }
  .btn.buzz { font-family: var(--display); font-weight: 800; font-size: 22px; padding: 18px 40px; letter-spacing: .04em;
    background: linear-gradient(180deg, #FFB0A0 0%, #F4553A 48%, #D63A1F 52%, #F26446 100%); box-shadow: 0 12px 26px -10px rgba(200,50,20,.9), inset 0 -3px 6px rgba(110,10,0,.35), inset 0 0 0 1px rgba(255,255,255,.4); text-shadow: 0 1px 2px rgba(110,10,0,.5); }
  .btn:focus-visible, .pill-btn:focus-visible, .subchip:focus-visible, .seg button:focus-visible, .chipbtn:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }

  /* ---------- tossup ---------- */
  .q-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font: 700 11.5px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 7px 11px; border-radius: 99px; color: #fff; background: var(--c, var(--accent)); box-shadow: inset 0 1px 0 rgba(255,255,255,.4); }
  .chip.ai { background: linear-gradient(90deg, #8B5CF6, #EC4899); }
  .chip.live { background: #0B2540; color: #BFF1FF; }
  .chip.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #4CE07A; box-shadow: 0 0 0 3px rgba(76,224,122,.25); }
  .small { font-size: 12.5px; color: var(--ink-soft); }
  .reader { margin: 0; font-size: clamp(18px, 2.5vw, 21px); line-height: 1.62; background: var(--card); border-radius: 14px; padding: 16px 18px; border: 1px solid var(--line); min-height: 4.8em; }
  .reader .w { opacity: 0; transition: opacity .12s; }
  .reader .w.on, .reader.done .w { opacity: 1; }
  .reader.done .w.pw { font-weight: 700; }
  .pm { font-weight: 800; color: var(--pink); margin-right: .3em; }
  .bz { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; font: 800 11px/1 var(--body); color: #fff; vertical-align: 2px; margin-right: .3em; background: var(--c, var(--bad)); box-shadow: 0 2px 6px -2px rgba(0,0,0,.4); }
  .bz.ok { background: var(--good); }
  .answer-line { margin: 0; font-size: 16.5px; }
  .answer-line .al { font-weight: 800; letter-spacing: .04em; font-size: 12.5px; color: var(--ink-soft); margin-right: 6px; }
  .answer-line u { text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .zone { display: grid; gap: 12px; }
  .guess-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
  .abar { height: 10px; border-radius: 99px; background: var(--card-2); overflow: hidden; border: 1px solid var(--line); }
  .abar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #6FCE3F, #36B3DE); border-radius: 99px; }
  .abar i.low { background: linear-gradient(90deg, #FF6B90, #FFA15E); }
  .result { display: grid; gap: 8px; border-radius: 14px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); }
  .result.ok { box-shadow: inset 0 0 0 3px var(--good); } .result.bad { box-shadow: inset 0 0 0 3px var(--bad); } .result.dead { box-shadow: inset 0 0 0 3px var(--line); }
  .result-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .verdict { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1; }
  .result.ok .verdict { color: var(--good); } .result.bad .verdict { color: var(--bad); }
  .pts { font-family: var(--display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
  .quip { margin: 0; display: flex; gap: 10px; align-items: center; font-style: italic; color: var(--ink-soft); }
  .note { margin: 0; padding: 11px 14px; border-radius: 12px; font-size: 14.5px; background: #FFF4D6; color: #6A4A00; border: 1px solid #F3D98A; }
  .note.err { background: #FFE7EC; color: #8A1432; border-color: #F7B6C5; }
  .note.ok { background: #E6F8E0; color: #1F5E12; border-color: #B9E6A8; }
  .panel { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; background: var(--card); border-radius: 14px; padding: 12px 16px; border: 1px solid var(--line); }
  .panel p { margin: 0; font-weight: 600; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .bonus-part { display: grid; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .bonus-part.ok { box-shadow: inset 4px 0 0 var(--good); } .bonus-part.bad { box-shadow: inset 4px 0 0 var(--bad); }
  .bonus-part p { margin: 0; }
  .toast { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 40; font-family: var(--display); font-weight: 800; font-size: clamp(40px, 10vw, 76px); color: #fff; pointer-events: none;
    text-shadow: 0 4px 0 #C8920A, 0 10px 30px rgba(200,140,0,.6); animation: toast 1.2s ease-out both; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.6); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.08); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -30px) scale(1); } }

  /* ---------- live ---------- */
  .code-box { display: flex; align-items: center; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap; background: var(--card); border-radius: 14px; padding: 14px 18px; border: 1px solid var(--line); }
  .code { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 9vw, 52px); letter-spacing: .14em; line-height: 1; }
  .roster { display: flex; flex-wrap: wrap; gap: 8px; }
  .pchip { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 14.5px; max-width: 100%; }
  .dot { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 800 12px/1 var(--body); box-shadow: inset 0 -2px 4px rgba(0,0,0,.2); }
  .pchip .st { font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
  .pchip.buzzed .st { color: var(--bad); } .pchip.done .st { color: var(--good); }
  .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 18ch; }
  .tag { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 6px; background: var(--gold); color: #0B2540; }
  .tag.you { background: #8FE3F7; }
  .tag.win { background: var(--good); color: #fff; }
  .rows { display: grid; gap: 8px; }
  .prow { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .prow.first { background: linear-gradient(90deg, color-mix(in srgb, var(--gold) 35%, var(--card)), var(--card)); }
  .rank { font-family: var(--display); font-weight: 800; font-size: 19px; text-align: center; font-variant-numeric: tabular-nums; }
  .big { font-family: var(--display); font-weight: 800; font-size: 22px; text-align: right; font-variant-numeric: tabular-nums; line-height: 1; }
  .big small { display: block; font: 700 10px/1.5 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  .pname { font-weight: 700; overflow-wrap: anywhere; }
  .psub { font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }

  /* ---------- final ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .stat-card { background: var(--card); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; border: 1px solid var(--line); }
  .stat-card b { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .stat-card span { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  .rank-title { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(26px, 5.5vw, 40px); line-height: 1.05; text-wrap: balance; }
  .log { display: grid; gap: 6px; }
  .log-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--card); border-radius: 10px; padding: 8px 12px; font-size: 14px; border: 1px solid var(--line); }
  .log-row .mk { font-family: var(--display); font-weight: 800; font-size: 14px; text-align: center; border-radius: 8px; padding: 4px 0; color: #fff; background: var(--line); }
  .log-row.p .mk { background: var(--gold); color: #0B2540; } .log-row.t .mk { background: var(--good); } .log-row.n .mk { background: var(--bad); }
  .log-q { font-weight: 700; }
  .log-a { color: var(--ink-soft); overflow-wrap: anywhere; }

  /* ---------- modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(0,30,60,.35); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .modal .win { width: min(640px, 100%); max-height: calc(100vh - 32px); overflow: auto; }
  .close-x { cursor: pointer; border: 1px solid rgba(255,255,255,.6); border-radius: 4px; width: 40px; height: 18px; background: linear-gradient(180deg, #F5A08E 0%, #E0533A 50%, #C63B22 51%, #E86A4E 100%); color: #fff; font: 800 11px/1 var(--body); }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .swatch { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; background: radial-gradient(circle at 34% 28%, #fff 0 10%, var(--c) 60%, color-mix(in srgb, var(--c) 60%, black)); box-shadow: 0 4px 10px -4px rgba(0,0,0,.4); }
  .swatch[aria-pressed="true"] { border-color: var(--ink); }
  .acc-btn { width: 40px; height: 40px; border-radius: 12px; cursor: pointer; font-size: 20px; border: 2px solid var(--line); background: var(--card); }
  .acc-btn[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, var(--card)); }
  input[type=color] { width: 44px; height: 38px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 2px; cursor: pointer; }
  .scenes { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .scene-btn { cursor: pointer; border-radius: 12px; border: 2px solid var(--line); padding: 0; overflow: hidden; background: var(--card); text-align: left; font: 700 13px/1.2 var(--body); color: var(--ink); }
  .scene-btn span { display: block; height: 54px; }
  .scene-btn em { display: block; padding: 7px 9px; font-style: normal; }
  .scene-btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }

  /* ---------- music player (WMP-style) ---------- */
  .player { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(760px, calc(100% - 24px));
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 12px 8px 8px; border-radius: 22px; color: #EAF8FF;
    background: linear-gradient(180deg, rgba(60,70,85,.92) 0%, rgba(25,30,40,.94) 50%, rgba(8,10,16,.96) 51%, rgba(30,38,50,.94) 100%);
    border: 1px solid rgba(255,255,255,.25); box-shadow: 0 16px 36px -14px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.35); }
  .player.min { grid-template-columns: auto auto; width: auto; left: auto; right: 12px; transform: none; }
  .player.min .pl-meta, .player.min .pl-ctrls .hide-min, .player.min .pl-list { display: none; }
  .pl-play { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; text-decoration: none; position: relative;
    background: radial-gradient(circle at 50% 30%, #D9F6FF 0 12%, #5CC8F2 45%, #0E6FA3 100%); box-shadow: 0 0 18px rgba(80,200,255,.55), inset 0 -3px 6px rgba(0,40,80,.5), inset 0 0 0 1px rgba(255,255,255,.5); }
  .pl-play::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 45%; border-radius: 50% 50% 45% 45%; background: linear-gradient(rgba(255,255,255,.8), rgba(255,255,255,0)); }
  .pl-play svg { width: 22px; height: 22px; fill: #fff; margin-left: 3px; filter: drop-shadow(0 1px 1px rgba(0,40,80,.6)); }
  .pl-meta { min-width: 0; display: grid; gap: 1px; }
  .pl-title { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-artist { font-size: 12.5px; color: #A9D8EC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl-note { font-size: 10.5px; color: #86AFC2; letter-spacing: .04em; }
  .pl-ctrls { display: flex; gap: 6px; align-items: center; }
  .pl-btn { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; border: 1px solid rgba(255,255,255,.25); color: #fff; text-decoration: none;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,.05) 50%, rgba(0,0,0,.2) 51%, rgba(255,255,255,.08)); }
  .pl-btn svg { width: 16px; height: 16px; fill: currentColor; }
  .pl-btn:hover, .pl-play:hover { filter: brightness(1.15); }
  .pl-btn:focus-visible, .pl-play:focus-visible { outline: 3px solid #8FE3F7; outline-offset: 2px; }
  .pl-list { position: absolute; bottom: calc(100% + 8px); right: 0; width: min(380px, 100%); max-height: 50vh; overflow: auto; border-radius: 16px; padding: 8px;
    background: rgba(15,22,32,.95); border: 1px solid rgba(255,255,255,.2); box-shadow: 0 16px 36px -14px rgba(0,0,0,.7); display: grid; gap: 2px; }
  .pl-list a { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; padding: 7px 8px; border-radius: 8px; color: #EAF8FF; text-decoration: none; font-size: 13.5px; }
  .pl-list a:hover { background: rgba(120,200,255,.15); }
  .pl-list a.cur { background: rgba(80,200,255,.25); }
  .pl-list a span:first-child { color: #86AFC2; text-align: right; font-variant-numeric: tabular-nums; }
  .pl-list a small { display: block; color: #86AFC2; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-list a b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .pl-list a, .pl-list button { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; padding: 7px 8px; border-radius: 8px; color: #EAF8FF; text-decoration: none; font: 13.5px/1.35 var(--body); text-align: left; background: none; border: 0; cursor: pointer; width: 100%; }
  .pl-list button:hover { background: rgba(120,200,255,.15); }
  .pl-list button.cur { background: rgba(80,200,255,.25); }
  .pl-list button span:first-child { color: #86AFC2; text-align: right; font-variant-numeric: tabular-nums; }
  .pl-list button small { display: block; color: #86AFC2; font-size: 11.5px; }
  .pl-list button b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-list .pl-clear { display: block; margin-top: 6px; text-align: center; color: #FFB3C4; border: 1px solid rgba(255,140,170,.35); }
  .pl-src { display: inline-flex; gap: 4px; margin-top: 4px; }
  .pl-src button { cursor: pointer; font: 700 10.5px/1 var(--body); letter-spacing: .04em; padding: 5px 9px; border-radius: 99px; color: #A9D8EC; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); }
  .pl-src button[aria-pressed="true"] { color: #06283D; background: linear-gradient(180deg, #D9F6FF, #5CC8F2); border-color: transparent; }
  .pl-src button:focus-visible { outline: 2px solid #8FE3F7; outline-offset: 2px; }
  .pl-seek { display: flex; align-items: center; gap: 8px; }
  .pl-seek input { flex: 1; min-width: 60px; accent-color: #5CC8F2; height: 14px; }
  .pl-seek span { font-size: 11px; color: #A9D8EC; font-variant-numeric: tabular-nums; white-space: nowrap; }
  label.pl-play, label.pl-btn { cursor: pointer; }
  label.pl-play svg { margin-left: 0; }

  /* ---------- overlay ---------- */
  #wave { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center; cursor: pointer; padding-inline: 16px;
    background: radial-gradient(circle at 50% 45%, #D9F6FF 0%, #5CC8F2 40%, #1286BF 72%, #064B75 100%); }
  #wave canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .k-inner { position: relative; display: grid; gap: 10px; justify-items: center; animation: slam .7s cubic-bezier(.2,1.6,.4,1) both; }
  .k-pre { font: 800 14px/1.4 var(--body); letter-spacing: .2em; text-transform: uppercase; color: #fff; }
  .k-title { font-family: var(--display); font-weight: 800; font-size: clamp(50px, 14vw, 128px); line-height: .9; color: #fff; text-shadow: 0 6px 0 #0B5F91, 0 14px 40px rgba(0,40,80,.55); }
  .k-tap { font: 700 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: rgba(255,255,255,.85); margin-top: 14px; }
  @keyframes slam { from { transform: scale(2.4) rotate(-5deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .enter { animation: rise .35s cubic-bezier(.2,.9,.3,1.1) both; }
  @keyframes rise { from { transform: translateY(10px); opacity: .01; } to { transform: none; opacity: 1; } }

  /* =================== THEMES (more scenes) =================== */
  body[data-scene="wii"] {
    --sky-top: #E9F2F8; --sky-mid: #F5F9FC; --sky-low: #FFFFFF; --hill-1: #D5E7F2; --hill-2: #B4D2E4; --hill-shine: rgba(255,255,255,.8); --sun: rgba(255,255,255,.9);
    --ink: #33424D; --ink-soft: #6B7D8A; --accent: #34BEED; --accent-deep: #1591C0; --line: rgba(52,190,237,.28);
    --bar-top: #FFFFFF; --bar-bot: #EAF4FA;
  }
  body[data-scene="zune"] {
    color-scheme: dark;
    --sky-top: #0B0B0D; --sky-mid: #17171B; --sky-low: #242429; --hill-1: #FF6A1A; --hill-2: #E0106E; --hill-shine: rgba(255,200,150,.35); --sun: rgba(255,90,40,.25);
    --ink: #F4F4F6; --ink-soft: #B9B9C2; --card: #1D1D22; --card-2: rgba(40,40,46,.8);
    --glass-top: rgba(38,38,44,.86); --glass-bot: rgba(20,20,24,.78); --glass-edge: rgba(255,255,255,.14);
    --bar-top: rgba(70,70,80,.8); --bar-bot: rgba(30,30,36,.8); --line: rgba(255,255,255,.14);
    --accent: #FF5B2E; --accent-deep: #FF9A6B; --good: #5FD34A; --bad: #FF5C8A; --shadow: 0 24px 60px -26px rgba(0,0,0,.85);
  }
  body[data-scene="chrome"] {
    --sky-top: #C9D3DC; --sky-mid: #EEF2F6; --sky-low: #DCE3EA; --hill-1: #B6C3CF; --hill-2: #8595A6; --hill-shine: rgba(255,255,255,.75); --sun: rgba(255,255,255,.95);
    --ink: #1E2A36; --ink-soft: #52616F; --accent: #3D7BD9; --accent-deep: #22539E; --line: rgba(60,90,130,.25);
    --bar-top: #FFFFFF; --bar-bot: #CDD6DF;
  }
  body[data-scene="vapor"] {
    --sky-top: #FFB8E0; --sky-mid: #DCC6FF; --sky-low: #C2F4FF; --hill-1: #FF9ACF; --hill-2: #A77BFF; --hill-shine: rgba(255,255,255,.55); --sun: rgba(255,240,250,.95);
    --ink: #3A1F4D; --ink-soft: #6E5584; --accent: #B84CF0; --accent-deep: #7B2DB0; --line: rgba(184,76,240,.25);
  }
  body[data-scene="rainforest"] {
    --sky-top: #7FDDB8; --sky-mid: #CFF7E6; --sky-low: #F2FFF8; --hill-1: #3DB36F; --hill-2: #16703C; --hill-shine: rgba(255,255,255,.45); --sun: rgba(255,255,220,.95);
    --ink: #0E2A1E; --ink-soft: #3E6152; --accent: #14A06B; --accent-deep: #0B7049; --line: rgba(20,160,107,.25);
  }
  body[data-scene="paper"] {
    --sky-top: #F4F2EC; --sky-mid: #F4F2EC; --sky-low: #F4F2EC; --sun: transparent;
    --ink: #1E2A33; --ink-soft: #55636E; --card: #FFFFFF; --card-2: #FAF9F6;
    --glass-top: #FFFFFF; --glass-bot: #FFFFFF; --glass-edge: #DDD8CC; --bar-top: #FAF8F3; --bar-bot: #F0EDE4; --line: #DDD8CC;
    --accent: #2B6CB0; --accent-deep: #1F4F85; --shadow: 0 10px 30px -22px rgba(0,0,0,.35);
  }
  body[data-scene="paper"] .scene { display: none; }
  body[data-hills="off"] .scene { display: none; }

  /* accent-driven gel buttons (theme or user accent) */
  .btn { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 38%, white) 0%, color-mix(in srgb, var(--accent) 85%, white) 48%, var(--accent) 52%, color-mix(in srgb, var(--accent) 88%, white) 100%);
    box-shadow: 0 10px 22px -10px color-mix(in srgb, var(--accent) 80%, black), inset 0 -2px 4px rgba(0,0,0,.18), inset 0 0 0 1px rgba(255,255,255,.4); text-shadow: 0 1px 1px rgba(0,0,0,.3); }
  .seg button[aria-pressed="true"] { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 38%, white) 0%, color-mix(in srgb, var(--accent) 85%, white) 48%, var(--accent) 52%, color-mix(in srgb, var(--accent) 88%, white) 100%); }

  /* =================== FONT PAIRS =================== */

  body[data-font="scholar"] { --display: "Fraunces", Georgia, serif; --body: "Source Serif 4", Georgia, serif; }
  body[data-font="pixel"] { --display: "Press Start 2P", monospace; --body: "Atkinson Hyperlegible", "Segoe UI", sans-serif; }
  body[data-font="pixel"] .brand-name, body[data-font="pixel"] .h2, body[data-font="pixel"] .rank-title, body[data-font="pixel"] .verdict, body[data-font="pixel"] .k-title { font-size: .72em; letter-spacing: 0; line-height: 1.4; }
  body[data-font="readable"] { --display: "Atkinson Hyperlegible", "Segoe UI", sans-serif; --body: "Atkinson Hyperlegible", "Segoe UI", sans-serif; }

  body[data-reader="dys"] .reader { font-family: "Atkinson Hyperlegible", sans-serif; letter-spacing: .02em; word-spacing: .08em; }
  .reader { font-size: var(--reader-size, clamp(18px, 2.5vw, 21px)); line-height: var(--reader-lh, 1.62); }
  body[data-powerbold="off"] .reader.done .w.pw { font-weight: inherit; }
  body[data-powermark="off"] .pm { display: none; }
  .wrap { zoom: var(--scale, 1); }

  /* =================== WINDOW STYLES =================== */
  .win, .card, .speech, .mode, .reader, .result, .bonus-part, .panel, .prow, .log-row, .stat-card, .code-box, .qrow, .deck-card { border-radius: var(--radius, 16px); }
  .titlebar { border-radius: 0; }
  body[data-win="frost"] .win { background: linear-gradient(180deg, color-mix(in srgb, var(--glass-top) 100%, var(--card) 40%), var(--glass-top)); -webkit-backdrop-filter: blur(26px) saturate(1.6); backdrop-filter: blur(26px) saturate(1.6); }
  body[data-win="solid"] .win { background: var(--card); -webkit-backdrop-filter: none; backdrop-filter: none; }
  body[data-win="flat"] .win { background: var(--card); -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; border-color: var(--line); }
  body[data-win="flat"] .win-body::before, body[data-win="solid"] .win-body::before { display: none; }
  body[data-win="outline"] .win { background: color-mix(in srgb, var(--card) 55%, transparent); box-shadow: none; border: 2px solid var(--accent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  body[data-titlebars="off"] .titlebar { display: none; }
  body[data-titlebars="plain"] .titlebar { background: transparent; border-bottom-color: transparent; }
  body[data-titlebars="plain"] .tb-ctrls { display: none; }
  body[data-btn="flat"] .btn, body[data-btn="flat"] .seg button[aria-pressed="true"] { background: var(--accent); box-shadow: none; text-shadow: none; }
  body[data-btn="flat"] .btn::after { display: none; }
  body[data-btn="flat"] .btn.green { background: var(--good); } body[data-btn="flat"] .btn.pink { background: var(--pink); } body[data-btn="flat"] .btn.buzz { background: #E0452A; }
  body[data-btn="flat"] .btn.ghost { background: var(--card); color: var(--accent-deep); box-shadow: inset 0 0 0 1px var(--line); }

  body[data-btn="outline"] .btn::after { display: none; }
  body[data-btn="outline"] .btn.buzz { color: #E0452A; box-shadow: inset 0 0 0 3px #E0452A; }
  body[data-btnshape="rounded"] .btn, body[data-btnshape="rounded"] .seg button, body[data-btnshape="rounded"] .pill-btn { border-radius: 12px; }
  body[data-btnshape="square"] .btn, body[data-btnshape="square"] .seg button, body[data-btnshape="square"] .pill-btn { border-radius: 4px; }
  body[data-density="compact"] .win-body { padding: 14px 16px; gap: 10px; }
  body[data-density="compact"] .wrap, body[data-density="compact"] #app { gap: 12px; }
  body[data-density="compact"] .btn { padding: 11px 18px; font-size: 15px; }
  body[data-motion="off"] *, body[data-motion="off"] *::before, body[data-motion="off"] *::after { animation: none !important; transition: none !important; }

  /* =================== NAV, PLAYER CARD, DECK =================== */
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav button { cursor: pointer; font: 700 14px/1 var(--body); padding: 10px 16px; border-radius: 99px; border: 1px solid var(--glass-edge); color: var(--ink);
    background: linear-gradient(180deg, var(--bar-top), var(--bar-bot)); box-shadow: 0 6px 14px -10px rgba(0,40,80,.6); }
  .nav button[aria-current="page"] { color: #fff; border-color: transparent; text-shadow: 0 1px 1px rgba(0,0,0,.3);
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 38%, white) 0%, var(--accent) 50%, color-mix(in srgb, var(--accent) 85%, black) 51%, var(--accent) 100%); }
  .nav button:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

<script>
(() => {
  "use strict";
  /* =====================================================================

  const CATS = {

  const RAW_TOSSUPS = [
    // ---------- American History ----------
    ["amhist", "This man's \u201cHouse Divided\u201d speech opened a Senate campaign that he lost to Stephen Douglas. Early in a war, he suspended habeas corpus, (*) and he later issued a proclamation freeing enslaved people in rebelling states. For 10 points, name this president who delivered the Gettysburg Address.", "Abraham {Lincoln}"],
    ["amhist", "Robert Livingston and James Monroe negotiated this deal, which some argued the Constitution did not authorize. It became possible after the Haitian Revolution soured Napoleon's plans for the Americas. (*) Lewis and Clark explored the land acquired in, for 10 points, what 1803 purchase of territory from France?", "{Louisiana} Purchase"],
    ["amhist", "Alexander Butterfield revealed a secret White House taping system during hearings on this scandal, and the Saturday Night Massacre saw the firing of Archibald Cox. A \u201csmoking gun\u201d tape proved a cover-up (*) of a 1972 break-in at Democratic headquarters. For 10 points, name this scandal that led Richard Nixon to resign.", "{Watergate} scandal"],
    ["amhist", "This case arose from \u201cmidnight appointments\u201d made at the end of John Adams's presidency. Its opinion struck down part of the Judiciary Act of 1789, (*) and in it John Marshall established judicial review. For 10 points, name this 1803 Supreme Court case.", "{Marbury} v. Madison"],
    ["amhist", "This woman led the Combahee Ferry raid during the Civil War, freeing more than 700 people. Nicknamed \u201cMoses,\u201d she (*) made about thirteen trips back to Maryland to guide enslaved people north. For 10 points, name this conductor on the Underground Railroad.", "Harriet {Tubman}"],
    ["amhist", "Kenneth and Mamie Clark's doll experiments were cited in a footnote of this decision. Thurgood Marshall argued for the plaintiffs, and Earl Warren wrote the unanimous opinion (*) overturning the \u201cseparate but equal\u201d doctrine. For 10 points, name this 1954 case that desegregated public schools.", "{Brown} v. Board of Education"],
    ["amhist", "Frances Perkins, the first female Cabinet member, served under this president. His Fireside Chats reassured the public, and his New Deal (*) created Social Security. For 10 points, name this only U.S. president elected four times.", "Franklin Delano {Roosevelt}", ["FDR", "Franklin Roosevelt"], ["Roosevelt"]],

    // ---------- European History ----------
    ["eurohist", "This man edited the Ems Dispatch to provoke France into war. He introduced health insurance and old-age pensions partly to undercut socialists, and he waged a (*) Kulturkampf against the Catholic Church. For 10 points, name this \u201cIron Chancellor\u201d who unified Germany.", "Otto von {Bismarck}"],
    ["eurohist", "This man was hidden at Wartburg Castle, where he translated the New Testament into German. He was declared an outlaw at the Diet of Worms after (*) refusing to recant. For 10 points, name this monk who, according to tradition, nailed the Ninety-five Theses to a church door in 1517.", "Martin {Luther}"],
    ["eurohist", "The farmhouse of La Haye Sainte fell during this battle, and Bl\u00fccher's Prussians arrived late in the day to help win it. (*) The Duke of Wellington defeated Napoleon for the last time at, for 10 points, what 1815 battle in present-day Belgium?", "Battle of {Waterloo}"],
    ["eurohist", "This ruler toured Western Europe in the Grand Embassy, working incognito in Dutch shipyards. He defeated Charles XII at the Battle of Poltava (*) and founded a new capital on the Baltic. For 10 points, name this Russian tsar who taxed beards and built St. Petersburg.", "{Peter} the Great", ["Peter I"]],
    ["eurohist", "The frame story of Boccaccio's Decameron has ten people fleeing this event in Florence. Flagellants roamed Europe in response to it, (*) and the labor shortage it caused weakened serfdom. For 10 points, name this 14th-century plague pandemic that killed perhaps a third of Europe.", "{Black Death}", ["bubonic plague", "plague", "great mortality"]],
    ["eurohist", "This man was blamed for the Gallipoli disaster as First Lord of the Admiralty. He later warned of an (*) \u201cIron Curtain\u201d in a speech in Fulton, Missouri. For 10 points, name this British prime minister during World War II who offered \u201cblood, toil, tears and sweat.\u201d", "Winston {Churchill}"],

    // ---------- World History ----------
    ["worldhist", "The Charter Oath was issued during this period, which followed the Boshin War and the fall of the Tokugawa shogunate. The samurai class was abolished during it, (*) prompting the Satsuma Rebellion. For 10 points, name this era of rapid Japanese modernization named for an emperor.", "{Meiji} Restoration", ["Meiji era", "Meiji period"]],
    ["worldhist", "This ruler commissioned the Djinguereber Mosque in Timbuktu. His 1324 pilgrimage through Cairo reportedly (*) depressed the price of gold for years. For 10 points, name this fabulously wealthy emperor of Mali.", "{Mansa Musa}", ["Musa", "Musa I"]],
    ["worldhist", "This ruler's birth name was Tem\u00fcjin, and he issued a legal code called the Yassa. After being proclaimed ruler at a 1206 (*) kurultai, he invaded the Khwarazmian Empire. For 10 points, name this founder of the Mongol Empire.", "{Genghis Khan}", ["Chinggis Khan", "Temujin", "Genghis"]],
    ["worldhist", "This man wrote the Cartagena Manifesto and the Jamaica Letter. He won the Battle of Boyac\u00e1 and led (*) the short-lived republic of Gran Colombia. For 10 points, name this \u201cLiberator\u201d of much of South America, the namesake of Bolivia.", "Sim\u00f3n {Bol\u00edvar}"],
    ["worldhist", "This ruler built the city of Fatehpur Sikri and promoted a syncretic faith called Din-i Ilahi. He abolished the jizya tax on non-Muslims (*) and expanded the empire founded by his grandfather Babur. For 10 points, name this greatest Mughal emperor.", "{Akbar} the Great"],
    ["worldhist", "Cyril Radcliffe drew a border line for this event in just five weeks, splitting Punjab and Bengal. Up to a million people died in the violence (*) that accompanied it in 1947. For 10 points, name this division of British India into two independent states.", "{Partition} of India", ["partition of british india", "indian partition"]],

    // ---------- Ancient History ----------
    ["ancient", "This man wrote commentaries on his wars in Gaul, including his siege of Vercingetorix at Alesia. He crossed the Rubicon (*) in 49 BC, starting a civil war against Pompey. For 10 points, name this Roman dictator assassinated on the Ides of March.", "Julius {Caesar}", ["Gaius Julius Caesar"]],
    ["ancient", "This ruler conquered Larsa by defeating its king Rim-Sin. His law code, carved on a basalt stele now in the Louvre, (*) is famous for the principle of \u201can eye for an eye.\u201d For 10 points, name this Babylonian king.", "{Hammurabi}", ["Hammurapi"]],
    ["ancient", "Cleon and Brasidas both died at the Battle of Amphipolis in this war. One side suffered a disastrous Sicilian Expedition (*) and a plague that killed Pericles. For 10 points, name this war between Athens and Sparta chronicled by Thucydides.", "{Peloponnesian} War"],
    ["ancient", "This ruler named a city after his horse Bucephalus. He supposedly cut the Gordian Knot (*) and defeated Darius III at Gaugamela. For 10 points, name this Macedonian king tutored by Aristotle.", "{Alexander} the Great", ["Alexander III"]],
    ["ancient", "This ruler's chancellor Li Si helped him standardize weights, measures, and writing. He was buried with (*) an army of thousands of terracotta warriors. For 10 points, name this first emperor of a unified China.", "{Qin Shi Huang}", ["Shi Huangdi", "Qin Shi Huangdi", "Ying Zheng", "Shihuangdi"]],

  async function postScore(st, lk, R) {
    if (!R.ranked) return { ok: false, soft: true, msg: "Games with modifiers don't count for the leaderboard. Your stats and deck were still saved." };
    if (st.tuh < 10) return { ok: false, soft: true, msg: "Games need at least 10 tossups heard to count for the leaderboard." };
    if (!DB) return { ok: false, msg: "The leaderboard isn't available in this view, so this game wasn't posted." };
    if (!UID) return { ok: false, msg: "Scores post to the leaderboard when you're signed in to Claude." };
    const pp20 = Math.round((st.score / st.tuh) * 20 * 10) / 10;
    const comp = S.look.companion || "none";
    try {
      const ref = DB.doc("standings/" + UID);
      const snap = await ref.get();
      const cur = snap.exists ? clone(snap.data() || {}) : {};
      const bestKey = "b" + lk, classicKey = "c" + lk;
      const pb = !(typeof cur[bestKey] === "number" && cur[bestKey] >= pp20);
      const next = { ...cur, games: num(cur.games) + 1, tuh: num(cur.tuh) + st.tuh, powers: num(cur.powers) + st.p, tens: num(cur.tens) + st.t,
        negs: num(cur.negs) + st.n, bonusPts: num(cur.bonusPts) + num(st.bp), bonusHeard: num(cur.bonusHeard) + num(st.bh), updatedAt: Date.now() };
      if (P.profile?.color) next.color = P.profile.color;
      const h = cleanHandle(P.profile?.handle); if (h) next.handle = h; else delete next.handle;

      if (comp === "none" && !(typeof cur[classicKey] === "number" && cur[classicKey] >= pp20)) next[classicKey] = pp20;
      await ref.set(next);
      return { ok: true, pb, pp20 };
    } catch (e) {
      return { ok: false, msg: e?.code === "invalid_argument" ? "You can see the leaderboard but can't post to it. Ask the page's owner for Contributor access."

    }

    const fresh = allQuestions().filter((q) => passes(q, f, true) && (!card(q.id) || card(q.id).r === 0)).length;

  /* ---------- browse tab ---------- */
  function browseList() {
    const B = S.browse, qs = norm(B.q);
    let list = allQuestions().filter((q) => {
      if (B.level && q.lvl !== B.level) return false;
      if (B.cat && SUBS[q.sub]?.cat !== B.cat && q.sub !== B.cat) return false;
      const st = cardStatus(q.id), c = card(q.id);
      if (B.status === "starred" && !c?.st) return false;
      if (B.status === "indeck" && !(c && (c.r > 0 || c.q))) return false;
      if (B.status === "missed" && !(c && c.seen > c.ok)) return false;
      if (B.status === "queued" && !(c && c.q && !c.r)) return false;
      if (!["all", "starred", "indeck", "missed", "queued"].includes(B.status) && st !== B.status) return false;
      if (qs && !norm(q.text + " " + q.display).includes(qs)) return false;
      return true;
    });
    list.sort((a, b) => a.lvl - b.lvl || (SUBS[a.sub]?.cat || "").localeCompare(SUBS[b.sub]?.cat || "") || a.display.localeCompare(b.display));
    return list;
  }
  function qrowHTML(q) {
    const c = card(q.id), st = cardStatus(q.id), open = !!S.browse.open[q.id];
    const stLabel = { new: c?.q ? "queued" : "new", due: "due", learning: "learning", mature: "mature", suspended: "suspended" }[st];
    return `<div class="qrow ${c?.s ? "susp" : ""}"><div class="qhead"><span class="chip" style="--c:${catOf(q.sub).c}">${esc(SUBS[q.sub]?.name || "")}</span>${lvlBadge(q.lvl)}
        <span class="status ${st === "due" ? "due" : st === "learning" ? "learn" : st === "mature" ? "mature" : ""}">${stLabel}</span>
        ${c && c.seen ? `<span class="small">${c.ok}/${c.seen} correct${c.r > 0 && !c.s ? ` \u00b7 next ${c.d <= today() ? "today" : ivlLabel(c.d - today())}` : ""}</span>` : ""}${q.src === "ai" ? '<span class="chip ai">AI</span>' : ""}</div>
      <p class="qtext ${open ? "" : "clip"}">${esc(q.words.join(" "))}</p>

        <button class="mini" type="button" data-card="queue" data-id="${q.id}" aria-pressed="${!!(c && (c.r > 0 || c.q))}">${c && (c.r > 0 || c.q) ? "In deck" : "+ Add to deck"}</button>

  function browseResults() {

      <div class="row"><button class="btn ghost" data-action="bulk" data-val="study" type="button" ${list.length ? "" : "disabled"}>Study these (${Math.min(list.length, 60)})</button>

  function browseTab() {

  function refreshBrowse() { const el = $("#browse-results"); if (el) el.innerHTML = browseResults(); }
  function cardAction(act, id) {
    const q = getQ(id); if (!q) return;
    if (act === "open") { S.browse.open[id] = !S.browse.open[id]; }
    else if (act === "star") { const c = ensureCard(id); c.st = !c.st; if (!c.st && c.r === 0 && !c.q && !c.seen) delete P.deck.cards[id]; rememberAI(q); }
    else if (act === "queue") { const c = ensureCard(id); if (c.r > 0 || c.q) { if (c.r === 0) { delete c.q; if (!c.st && !c.seen) delete P.deck.cards[id]; } } else c.q = true; rememberAI(q); }
    else if (act === "suspend") { const c = ensureCard(id); c.s = !c.s; }
    else if (act === "reset") { delete P.deck.cards[id]; }
    else if (act === "play") { studyStart([id], "Single question"); return; }
    Save.queue("deck"); refreshBrowse();
  }
  function bulkAction(act) {
    const list = browseList();
    if (act === "study") { studyStart(list.slice(0, 60).map((q) => q.id), "Browse selection"); return; }
    for (const q of list) {
      const c = ensureCard(q.id);
      if (act === "queue" && c.r === 0) c.q = true;
      if (act === "star") c.st = true;
      if (act === "suspend") c.s = true;
      if (act === "unsuspend") delete c.s;
      rememberAI(q);
    }
    Save.queue("deck"); refreshBrowse();
  }

      <div class="row"><button class="btn ghost" data-action="copy-data" type="button">Copy my data</button>

  async function eraseProgress() {

    ["profile", "deck", "stats"].forEach((n) => store.set("p_" + n, null));

  /* =====================================================================
     SOLO: packets and study sessions
     ===================================================================== */
  let G = null;
  function newGame(kind, list, extra = {}) {
    Reader.key = "";
    G = { kind, list, i: 0, phase: "reading", st: { score: 0, p: 0, t: 0, n: 0, tuh: 0, bp: 0, bh: 0 }, log: [], usedB: [], post: null,
      subs: S.filters.mode === "dist" ? Object.keys(SUBS) : S.filters.subs.slice(), levels: S.filters.levels.slice(), R: rules(),
      buzzAt: -1, prompted: false, result: null, bonus: null, paused: false, protest: null, fresh: 0, requeued: {}, streak: 0, rated: 0, extra: {}, ...extra };
    S.view = "solo"; render(); window.scrollTo({ top: 0 }); blip(660, 0.06);
  }
  function soloStart() {
    const list = buildPacket(S.filters, S.len);
    if (!list.length && !(S.fresh && SAMPLE)) { alertNote("No questions match your filters. Widen the difficulty or categories."); return; }
    const packet = list.map((q) => q.id);
    const extra = {};
    if (list.length < S.len && S.fresh && SAMPLE) {
      for (let k = list.length; k < S.len; k++) { const ph = placeholderQ(); extra[ph.id] = ph; packet.push(ph.id); }
    }
    newGame("packet", packet, { extra, title: levelsLabel(S.filters.levels) });
    if (S.fresh && SAMPLE) requestFresh(G);
  }
  function placeholderQ() {
    const lvl = pick(S.filters.levels), sub = pick(S.filters.mode === "dist" ? Object.keys(SUBS) : S.filters.subs.length ? S.filters.subs : Object.keys(SUBS));
    const q = makeTossup(sub, "Neptuna is still writing this tossup. Skip ahead or wait a moment. (*) For 10 points, press N to skip.", "{skip}", [], [], "bank", lvl);
    q.id = "ph" + rid(); q.placeholder = true; return q;
  }
  function studyStart(ids, title) {
    let list = ids;
    if (!list) {
      const t = today(), f = S.filters, what = S.study.what;
      const due = what === "new" ? [] : Object.entries(P.deck.cards)
        .filter(([id, c]) => !c.s && c.r > 0 && c.d <= t && getQ(id) && passes(getQ(id), f, true))
        .sort((a, b) => a[1].d - b[1].d).slice(0, S.study.maxReviews).map(([id]) => id);
      const queued = Object.entries(P.deck.cards).filter(([id, c]) => !c.s && c.r === 0 && c.q && getQ(id) && passes(getQ(id), f, true)).map(([id]) => id);
      const fresh = shuffle(allQuestions().filter((q) => passes(q, f, true) && !card(q.id)).map((q) => q.id));
      const news = what === "due" ? [] : queued.concat(fresh).slice(0, newLeftToday());
      list = [];
      const a = due.slice(), b = news.slice();
      while (a.length || b.length) { if (a.length) list.push(a.shift()); if (a.length) list.push(a.shift()); if (b.length) list.push(b.shift()); }
    }
    if (!list.length) { alertNote("Nothing to study right now with these filters. Try adding new cards, or come back when reviews are due."); return; }
    newGame("study", list.slice(), { title: title || "Study session" });
  }
  function alertNote(msg) { Save.note = msg; renderHome(); setTimeout(() => { if (Save.note === msg) { Save.note = ""; } }, 100); }
  const curQ = () => getQ(G.list[G.i]);

  function viewSolo() {
    if (G.phase === "final") return viewSoloFinal();
    const q = curQ(), c = catOf(q.sub), R = G.R;
    const total = G.list.length;
    let body = tuMeta(q, G.i, total, G.paused ? " \u00b7 paused" : "");
    if (G.phase === "result" || G.phase === "bonus") {
      const r = G.result;
      const marks = r.buzzAt >= 0 ? [{ at: r.buzzAt, ok: r.ok, short: r.pts > 0 ? String(r.pts) : r.pts < 0 ? String(r.pts).replace("-", "\u2212") : "\u2717", label: "Your buzz" }] : [];
      body += revealHTML(q, marks) + `<p class="answer-line"><span class="al">ANSWER:</span>${answerHTML(q)}</p>`;
      body += `<div class="result ${r.buzzAt < 0 ? "dead" : r.ok ? "ok" : "bad"}"><div class="result-top"><span class="verdict">${esc(r.label)}</span><span class="pts">${r.pts > 0 ? "+" : ""}${r.pts}</span></div>
        ${r.guess ? `<p class="muted">You said: <b>${esc(r.guess)}</b></p>` : ""}${r.extraNote ? `<p class="small">${esc(r.extraNote)}</p>` : ""}
        <div class="quip">${orb("s")}<span>${esc(r.quip)}</span></div></div>`;
      if (G.protest) body += G.protest === "pending" ? `<div class="panel">${orb("s", true)}<p>${esc(hostFirst())} is reviewing your protest<span class="dots"></span></p></div>` : `<p class="note ${G.protest.accept ? "ok" : ""}">${esc(G.protest.reason)}</p>`;
      if (G.phase === "bonus") body += bonusHTML();
      else {
        const canProtest = !r.ok && r.guess && SAMPLE && !G.protest && R.protests;
        const c0 = card(q.id);
        if (G.kind === "study") {
          const sug = r.ok ? (r.kind === "power" || r.kind === "early" ? 3 : 2) : 0;
          body += `<div><span class="label">How well did you know it?</span><div class="rate">${["Again", "Hard", "Good", "Easy"].map((n, g) =>
            `<button type="button" class="${["again", "hard", "good", "easy"][g]} ${g === sug ? "sug" : ""}" data-action="rate" data-val="${g}" ${g === sug ? 'id="next-btn"' : ""}>${n}<small>${ivlLabel(nextInterval(c0, g))}</small><kbd>${g + 1}</kbd></button>`).join("")}</div></div>
            ${canProtest ? `<div class="row"><button class="btn ghost" data-action="solo-protest" type="button">Protest</button></div>` : ""}`;
        } else {
          const bonusNext = r.ok && S.bonuses && !G.sd;
          body += `<div class="row"><button class="btn ${bonusNext ? "pink" : ""}" id="next-btn" data-action="solo-next" type="button">${bonusNext ? "Play the bonus" : G.sd || G.i + 1 >= total ? "Finish" : "Next tossup"}</button>
            ${canProtest ? `<button class="btn ghost" data-action="solo-protest" type="button">Protest</button>` : ""}
            <button class="mini star" type="button" data-card="star-live" data-id="${q.id}" aria-pressed="${!!c0?.st}">${c0?.st ? "\u2605 Starred" : "\u2606 Star for study"}</button>
            <span class="small">Enter to continue</span></div>`;
        }
      }
    } else {
      body += readerHTML(q) + `<div class="zone" id="zone">${soloZoneHTML()}</div>`;
    }
    const title = `${G.kind === "study" ? "Study" : "Tossup"} ${G.i + 1} \u2014 ${esc(c.name)}${G.title ? ` \u00b7 ${esc(G.title)}` : ""}`;
    return win(title, body, { color: c.c, enter: false });
  }
  function soloZoneHTML() {
    const R = G.R;
    if (G.phase === "buzz") {
      return `${G.prompted ? `<p class="note">Prompt: can you be more specific?</p>` : ""}
        <div class="guess-row"><label class="sr" for="guess">Your answer</label><input class="text-in" id="guess" type="text" maxlength="80" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer and press Enter">
        <button class="btn" data-action="solo-submit" type="button">Answer</button></div>${countdownBar(R.answerSecs)}`;
    }
    if (G.phase === "dead") return `<div class="row"><button class="btn buzz" data-action="solo-buzz" type="button">BUZZ</button><span class="small">Question finished. Buzz now with no neg risk before it goes dead.</span></div>${countdownBar(deadSecs())}`;
    return `<div class="row"><button class="btn buzz" data-action="solo-buzz" type="button">BUZZ</button>
      <button class="btn ghost" data-action="solo-pause" type="button">${G.paused ? "Resume" : "Pause"}</button>
      <button class="btn ghost" data-action="solo-skip" type="button">Skip</button><span class="small"><kbd>${esc(S.look.buzzKey)}</kbd> to buzz</span></div>`;
  }
  function afterSolo() {
    if (G.phase === "reading" || G.phase === "buzz" || G.phase === "dead") {
      const q = curQ(), key = "solo:" + G.i + ":" + q.id;
      if (Reader.key === key) { Reader.attach(); if (G.phase === "reading" && !G.paused) Reader.resume(); }
      else Reader.start(q, key, G.R.speed, soloReadEnd);
      if (G.paused || G.phase !== "reading") Reader.stop();
      if (G.phase === "dead") countdown(deadSecs(), () => { if (G && G.phase === "dead") soloResolve(null); });
      if (G.phase === "buzz") { $("#guess")?.focus(); countdown(G.R.answerSecs, () => soloSubmit(true)); }
    } else if (G.phase === "bonus") {
      const inp = $("#bguess"); if (inp) { inp.focus(); countdown(G.R.bonusSecs, () => bonusSubmit(true)); } else $("#next-btn")?.focus();
    } else $("#next-btn")?.focus();
  }
  function updateZone() { const z = $("#zone"); if (z) z.innerHTML = soloZoneHTML(); }
  function soloReadEnd() {
    if (!G || G.phase !== "reading") return;
    G.phase = "dead"; updateZone();
    countdown(deadSecs(), () => { if (G && G.phase === "dead") soloResolve(null); });
  }
  function soloBuzz() {
    if (!G || !(G.phase === "reading" || G.phase === "dead")) return;
    if (curQ().placeholder) return;
    Reader.stop(); stopCountdown();
    G.buzzAt = Reader.seen(); G.phase = "buzz"; G.prompted = false;
    updateZone(); $("#guess")?.focus(); buzzSound();
    countdown(G.R.answerSecs, () => soloSubmit(true));

    const ov = $("#wave"); $("#k-pre").textContent = pre; $("#k-title").textContent = title; ov.hidden = false;
    [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.5, "square", 0.04)); noise(0.2, 3, 0.26);
    const stop = confetti($("#confetti"));
    let done = false;
    const close = () => { if (done) return; done = true; waveOpen = false; ov.hidden = true; stop(); document.removeEventListener("keydown", onKey, true); $("#next-btn")?.focus(); };
    const onKey = (e) => { if (["Escape", "Enter", " "].includes(e.key)) { e.preventDefault(); e.stopPropagation(); close(); } };
    ov.onclick = close; document.addEventListener("keydown", onKey, true); setTimeout(close, 3500);
  }
  function confetti(cv) {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const ctx = cv.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
    const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
    const colors = ["#FFFFFF", "#FFC93C", "#9BEBFB", "#C5F59A", "#FFB6C8"];
    const parts = Array.from({ length: reduce ? 50 : 150 }, () => ({ x: Math.random() * W, y: reduce ? Math.random() * H : -Math.random() * H * 0.8, vx: (Math.random() - 0.5) * 3 * dpr, vy: (2 + Math.random() * 4) * dpr,
      r: (5 + Math.random() * 10) * dpr, a: Math.random() * 6.3, va: (Math.random() - 0.5) * 0.25, c: colors[(Math.random() * colors.length) | 0], bub: Math.random() < 0.5 }));
    let raf = 0, alive = true;
    const frame = () => {
      ctx.clearRect(0, 0, W, H);
      for (const p of parts) {
        if (!reduce) { p.x += p.vx; p.y += p.vy; p.a += p.va; p.vy += 0.03 * dpr; if (p.y > H + 40) { p.y = -20; p.x = Math.random() * W; } }
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
        if (p.bub) { ctx.strokeStyle = p.c; ctx.lineWidth = 2 * dpr; ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 6.3); ctx.stroke(); }
        else { ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); }
        ctx.restore();
      }
      if (alive && !reduce) raf = requestAnimationFrame(frame);
    };
    frame();
    return () => { alive = false; cancelAnimationFrame(raf); ctx.clearRect(0, 0, W, H); };
  }


  /* =====================================================================
     EVENTS
     ===================================================================== */
  function toggleIn(arr, v) { return arr.includes(v) ? arr.filter((x) => x !== v) : [...arr, v]; }
  app.addEventListener("click", (e) => {
    const cb = e.target.closest("[data-card]");
    if (cb) {
      if (cb.dataset.card === "star-live") { const c = ensureCard(cb.dataset.id); c.st = !c.st; const q = getQ(cb.dataset.id); if (q) rememberAI(q); Save.queue("deck"); cb.setAttribute("aria-pressed", String(c.st)); cb.textContent = c.st ? "\u2605 Starred" : "\u2606 Star for study"; return; }
      return cardAction(cb.dataset.card, cb.dataset.id);
    }
    const b = e.target.closest("[data-action]");
    if (!b || b.disabled) return;
    const a = b.dataset.action, v = b.dataset.val;
    switch (a) {
      case "tab": S.tab = v; S.delArmed = false; renderHome(); window.scrollTo({ top: 0 }); break;
      case "set": if (b.dataset.key === "len") S.len = Number(v); saveSettings(); renderHome(); break;
      case "set-filter": S.filters.mode = v; saveSettings(); renderHome(); break;
      case "set-look": S.look[b.dataset.key] = Number(v); applyLook(); saveSettings(); renderHome(); break;
      case "set-study": S.study.what = v; saveSettings(); renderHome(); break;
      case "toggle-level": { const n = toggleIn(S.filters.levels, Number(v)); S.filters.levels = n.length ? n.sort() : S.filters.levels; saveSettings(); renderHome(); break; }
      case "toggle-sub": { S.filters.subs = toggleIn(S.filters.subs, b.dataset.sub); saveSettings(); renderHome(); $(`[data-sub="${b.dataset.sub}"]`)?.focus(); break; }
      case "toggle-cat": {
        const ks = Object.keys(SUBS).filter((k) => SUBS[k].cat === b.dataset.cat);
        const allOn = ks.every((k) => S.filters.subs.includes(k));
        S.filters.subs = allOn ? S.filters.subs.filter((k) => !ks.includes(k)) : [...new Set([...S.filters.subs, ...ks])];
        saveSettings(); renderHome(); break;
      }
      case "solo": soloStart(); break;
      case "study-start": studyStart(); break;
      case "study-starred": studyStart(Object.entries(P.deck.cards).filter(([id, c]) => c.st && !c.s && getQ(id)).map(([id]) => id), "Starred"); break;
      case "host": goOnline(newCode(), true); break;
      case "join": goOnline($("#join-code")?.value || S.joinCode, false); break;
      case "lb-tab": LB.tab = v; b.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); refreshLB(); break;
      case "open-custom": openCustom(v); break;
      case "ob-level": { const n = toggleIn(OB.levels, Number(v)); OB.levels = n.length ? n : OB.levels; renderHome(); break; }
      case "ob-color": OB.color = v; renderHome(); break;
      case "ob-create": createProfile(); break;
      case "pf-color": P.profile.color = v; P.profile.updated = Date.now(); Save.queue("profile"); renderHome(); break;
      case "browse-more": S.browse.page++; refreshBrowse(); break;
      case "bulk": bulkAction(v); break;
      case "copy-data": copyText(JSON.stringify({ profile: P.profile, deck: P.deck, stats: P.stats }, null, 1), b); break;
      case "delete-arm": S.delArmed = true; renderHome(); setTimeout(() => { if (S.delArmed) { S.delArmed = false; if (S.view === "home" && S.tab === "profile") renderHome(); } }, 4000); break;
      case "delete-data": eraseProgress(); break;
      case "solo-buzz": soloBuzz(); break;
      case "solo-submit": soloSubmit(false); break;
      case "solo-pause": togglePause(); break;
      case "solo-skip": soloSkip(); break;
      case "solo-next": soloNext(); break;
      case "solo-protest": soloProtest(); break;
      case "bonus-submit": bonusSubmit(); break;
      case "bonus-next": bonusNext(); break;
      case "bonus-protest": bonusProtest(Number(b.dataset.k)); break;
      case "rate": rate(Number(v)); break;
      case "home": S.view = "home"; G = null; renderHome(); window.scrollTo({ top: 0 }); break;
      case "copy": copyStat(b); break;
      case "copy-code": copyText(O.code.toUpperCase(), b); break;
      case "online-buzz": onlineBuzz(); break;
      case "online-submit": onlineSubmit(false); break;
      case "host-start": hostStart(); break;
      case "host-reveal": hostReveal(); break;
      case "host-next": hostNext(); break;
      case "takeover": takeOver(); break;
      case "leave-arm": O.leaveArmed = true; renderLive(); setTimeout(() => { if (O) { O.leaveArmed = false; renderLive(); } }, 3500); break;
      case "leave": leaveRoom(); break;
    }
  });
  let profileTimer = null;
  app.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "ob-handle") OB.handle = t.value;
    else if (t.id === "join-code") S.joinCode = t.value;
    else if (t.id === "b-q") { S.browse.q = t.value; S.browse.page = 1; refreshBrowse(); }
    else if (t.id === "pf-handle" && P.profile) { P.profile.handle = cleanHandle(t.value); clearTimeout(profileTimer); profileTimer = setTimeout(() => { Save.queue("profile"); renderBoard(); }, 500); }
    else if (t.id === "st-new") { S.study.newPerDay = Number(t.value); $("#st-new-v").textContent = t.value; saveSettings(); }
    else if (t.id === "st-max") { S.study.maxReviews = Number(t.value); $("#st-max-v").textContent = t.value; saveSettings(); }
  });
  app.addEventListener("change", (e) => {
    const t = e.target;
    if (t.id === "opt-bonus") { S.bonuses = t.checked; saveSettings(); }
    else if (t.id === "opt-fresh") { S.fresh = t.checked; saveSettings(); renderHome(); }
    else if (t.id === "opt-auto") { S.autoAdd = t.checked; saveSettings(); }
    else if (t.id === "f-source") { S.filters.source = t.value; saveSettings(); renderHome(); }
    else if (t.id === "lb-classic") { LB.classic = t.checked; refreshLB(); }
    else if (t.id === "b-level") { S.browse.level = Number(t.value); S.browse.page = 1; refreshBrowse(); }
    else if (t.id === "b-cat") { S.browse.cat = t.value; S.browse.page = 1; refreshBrowse(); }
    else if (t.id === "b-status") { S.browse.status = t.value; S.browse.page = 1; refreshBrowse(); }
    else if (t.id === "pf-grade" && P.profile) { P.profile.grade = t.value; Save.queue("profile"); renderHome(); }
    else if (t.id === "ob-grade") OB.grade = t.value;
  });
  function togglePause() {
    if (!G || G.phase !== "reading") return;
    G.paused = !G.paused;
    if (G.paused) Reader.stop(); else Reader.resume();
    updateZone();
    const m = $("#qpos"); if (m) m.textContent = `Tossup ${G.i + 1} of ${G.list.length}${G.paused ? " \u00b7 paused" : ""}`;
  }
  function soloSkip() { if (!G || !(G.phase === "reading" || G.phase === "dead")) return; Reader.kill(); stopCountdown(); advance(); }
  function isBuzzKey(e) { const k = S.look.buzzKey; return k === "Space" ? (e.key === " " || e.code === "Space") : k === "Enter" ? e.key === "Enter" : e.key.toLowerCase() === k; }
  document.addEventListener("keydown", (e) => {
    const typing = e.target.matches?.("input, textarea, select") && !["checkbox", "range", "color"].includes(e.target.type);
    if (!$("#custom").hidden || !$("#wave").hidden) return;
    if (e.key === "Enter" && typing) {
      if (e.target.id === "guess") { e.preventDefault(); S.view === "solo" ? soloSubmit(false) : onlineSubmit(false); }
      else if (e.target.id === "bguess") { e.preventDefault(); bonusSubmit(); }
      else if (e.target.id === "join-code") { e.preventDefault(); goOnline(e.target.value, false); }
      else if (e.target.id === "ob-handle") { e.preventDefault(); createProfile(); }
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (isBuzzKey(e)) {
      if (S.view === "solo" && G && (G.phase === "reading" || G.phase === "dead")) { e.preventDefault(); soloBuzz(); return; }
      if (S.view === "online" && O && O.my.st === "listen") { e.preventDefault(); onlineBuzz(); return; }
    }
    if (S.view === "solo" && G && G.kind === "study" && G.phase === "result" && /^[1-4]$/.test(e.key)) { e.preventDefault(); rate(Number(e.key) - 1); return; }
    if (e.key === "p" || e.key === "P") { if (S.view === "solo") togglePause(); }
    else if (e.key === "n" || e.key === "N") { if (S.view === "solo") soloSkip(); }
  });

  const menuBtn = $("#menu-btn");
  let menuArmed = null;
  menuBtn.addEventListener("click", () => {
    if (!menuArmed) {
      menuBtn.textContent = S.view === "online" ? "Tap again to leave" : "Tap again to quit"; menuBtn.classList.add("warn");
      menuArmed = setTimeout(() => { menuArmed = null; menuBtn.textContent = "Menu"; menuBtn.classList.remove("warn"); }, 3500);
      return;
    }
    clearTimeout(menuArmed); menuArmed = null; menuBtn.textContent = "Menu"; menuBtn.classList.remove("warn");
    if (S.view === "online") leaveRoom();
    else {
      if (G && G.kind === "study" && G.rated) { P.stats.games = (P.stats.games || []).concat([{ at: Date.now(), kind: "study", lv: `${G.rated} cards`, score: G.st.score, tuh: G.st.tuh, p: G.st.p, t: G.st.t, n: G.st.n }]).slice(-30); Save.queue("stats"); }
      Reader.kill(); stopCountdown(); S.view = "home"; G = null; renderHome(); window.scrollTo({ top: 0 });
    }
  });
  const muteBtn = $("#mute");
  function syncMute() { muteBtn.textContent = S.muted ? "Sound off" : "Sound on"; muteBtn.setAttribute("aria-pressed", String(S.muted)); }
  muteBtn.addEventListener("click", () => { S.muted = !S.muted; saveSettings(); syncMute(); if (!S.muted) blip(740, 0.05); });

  async function copyText(text, btn) {
    try { await navigator.clipboard.writeText(text); if (btn) btn.textContent = "Copied"; }
    catch {
      const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.append(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch {} ta.remove();
      if (btn) btn.textContent = ok ? "Copied" : "Copy blocked here";
    }
  }
  function copyStat(btn) {
    let st;
    if (S.view === "solo" && G) st = G.st;
    else if (O) st = { score: O.my.tot, tuh: O.my.heard, p: O.my.p, t: O.my.t, n: O.my.ng, bp: 0, bh: 0 };
    else return;
    const pp20 = st.tuh ? ((st.score / st.tuh) * 20).toFixed(1) : "0.0";
    const comp = COMPANIONS[S.look.companion];
    copyText(`Vibe Tank quizbowl \u00b7 ${st.score} pts \u00b7 ${st.p}/${st.t}/${st.n} (P/10/Neg) \u00b7 ${pp20} PP20TUH${st.bh ? ` \u00b7 ${(st.bp / st.bh).toFixed(1)} PPB` : ""}${comp?.animal ? ` \u00b7 with ${comp.name}` : ""}`, btn);
  }

  /* ---------- bubbles (density follows the Environment setting) ---------- */
  Bubbles = (function () {
    const cv = $("#bubbles"), ctx = cv.getContext("2d");
    let W, H, dpr, bs = [], running = false;
    const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches || !S.look.motion;
    const make = (y) => ({ x: Math.random() * W, y: y ?? H + Math.random() * H, r: (4 + Math.random() * 20) * dpr, s: (0.2 + Math.random() * 0.6) * dpr, w: Math.random() * 6.3 });
    function size() {
      dpr = Math.min(devicePixelRatio || 1, 2); W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
      const mult = { off: 0, low: 0.4, normal: 1, lots: 2 }[S.look.bubbles] ?? 1;
      bs = Array.from({ length: Math.round((Math.round(innerWidth / 45) + 8) * mult) }, () => make(Math.random() * H));
    }
    function frame() {
      ctx.clearRect(0, 0, W, H);
      const still = reduce();
      for (const b of bs) {
        if (!still) { b.y -= b.s; b.w += 0.01; b.x += Math.sin(b.w) * 0.25 * dpr; if (b.y < -b.r * 2) Object.assign(b, make()); }
        const g = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.05, b.x, b.y, b.r);
        g.addColorStop(0, "rgba(255,255,255,.95)"); g.addColorStop(0.35, "rgba(255,255,255,.16)"); g.addColorStop(0.88, "rgba(150,225,255,.2)"); g.addColorStop(1, "rgba(255,255,255,.75)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      }
      if (!still && !document.hidden && bs.length) requestAnimationFrame(frame); else running = false;
    }
    const start = () => { if (running) return; running = true; frame(); };
    addEventListener("resize", () => { size(); start(); });
    document.addEventListener("visibilitychange", () => { if (!document.hidden) start(); });
    return { reset() { size(); running = false; start(); } };
  })();

  /* =====================================================================
     BOOT
     ===================================================================== */
  (function boot() {
    applySettings(store.get("settings"));
    const l = store.get("look"); if (l) Object.assign(S.look, sanitizeLook(l));
    Save.loadLocal();
    if (P.profile?.look) Object.assign(S.look, sanitizeLook(P.profile.look));
    if (P.profile?.settings) applySettings(P.profile.settings);
    MP.min = !!store.get("mpmin"); MP.src = store.get("mpsrc") === "local" ? "local" : "spotify";
    syncMute(); mpShuffle(); renderPlayer(); applyLook(); render(); loadLocal();
    const c = window.claude;
    if (!c || typeof c.use !== "function") { LB.status = "off"; refreshLB(); refreshLiveCard(); return; }
    c.use("sample").then((x) => { SAMPLE = x || null; if (S.view === "home" && S.tab === "play") { const f = $("#opt-fresh"); if (f) f.disabled = !SAMPLE; } }).catch(() => {});
    c.use("room").then((x) => { ROOM = x || null; refreshLiveCard(); }).catch(() => refreshLiveCard());
    const dbP = c.use("db").then((x) => { DB = x || null; subscribeLB(); }).catch(() => { LB.status = "off"; refreshLB(); });
    const userP = c.use("user").then(async (x) => { USER = x || null; if (USER) { try { UID = await USER.id(); } catch { UID = null; } } }).catch(() => {});
    Promise.all([dbP, userP]).then(async () => {
      if (DB && UID) { await Save.loadCloud(); if (S.view === "home") renderHome(); }
      else Save.loaded = true;
      refreshLB(); if (UID) resolveNames([UID]);
    });
  })();

})();
